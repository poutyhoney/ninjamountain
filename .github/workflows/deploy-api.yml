name: Deploy API

"on":
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push the API image (skipped if it already exists)
        run: |
          if aws ecr describe-images --repository-name ninjamountain-api --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
              echo "Image $IMAGE_TAG already exists in ECR. Skipping the build."
          else
              REPO=$(aws ecr describe-repositories --repository-names ninjamountain-api --query 'repositories[0].repositoryUri' --output text)
              aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%/*}"
              docker buildx build --pull --platform linux/amd64 --provenance=false --sbom=false -t "$REPO:$IMAGE_TAG" --push apps/api
          fi

      - name: Check whether the API service is running
        id: service
        run: |
          status=$(aws ecs describe-services --cluster ninjamountain --services ninjamountain-api --query 'services[0].status' --output text 2>/dev/null || echo "NONE")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Service status: $status"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.service.outputs.status == 'ACTIVE'
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Deploy the new image with Terraform
        if: steps.service.outputs.status == 'ACTIVE'
        working-directory: infra/api-service
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan -var "image_tag=$IMAGE_TAG"
          terraform apply -input=false tfplan

      - name: Note when the service is not running
        if: steps.service.outputs.status != 'ACTIVE'
        run: echo "::notice::The API service is not running. Image $IMAGE_TAG was pushed and will be used the next time the stack is created."
