image: node:22

stages:
     - test

cache:
    key:
        files:
            - package-lock.json
    paths:
        - node_modules/

web:
    stage: test
    script:
        - npm ci
        - npm run lint:web
        - npm run typecheck:web
        - npm run build:web

store:
    stage: test
    script:
        - npm ci
        - npm run lint:store
        - npm run typecheck:store
        - npm run test:coverage:store
        - npm run build:store

e2e:
    stage: test
    script:
        - npm ci
        - npx playwright install --with-deps chromium
        - npm run build:store
        - npm run e2e:store

semgrep:
    stage: test
    image: semgrep/semgrep
    script: 
        - mkdir -p /src
        - cp -r "$CI_PROJECT_DIR"/. /src/
        - cd /src
        - semgrep scan --config auto
    rules:
        - if: $CI_PIPELINE_SOURCE == "web"
        - if: $CI_MERGE_REQUEST_IID
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH