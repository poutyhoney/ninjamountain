services:
  events-db:
    image: postgres:17
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: events
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - events-data:/var/lib/postgresql/data
      - ./apps/api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://events:local-dev-only@events-db:5432/events
    ports:
      - "8000:8000"
    depends_on:
      events-db:
        condition: service_healthy

  growthbook-mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local-dev-only
    volumes:
      - growthbook-mongo-data:/data/db

  growthbook:
    image: growthbook/growthbook:latest
    environment:
      MONGODB_URI: mongodb://root:local-dev-only@growthbook-mongo:27017/growthbook?authSource=admin
      APP_ORIGIN: http://localhost:3200
      API_HOST: http://localhost:3300
      JWT_SECRET: ${GROWTHBOOK_JWT_SECRET:?Set GROWTHBOOK_JWT_SECRET in the root .env file}
      ENCRYPTION_KEY: ${GROWTHBOOK_ENCRYPTION_KEY:?Set GROWTHBOOK_ENCRYPTION_KEY in the root .env file}
    ports:
      - "127.0.0.1:3200:3000"
      - "127.0.0.1:3300:3100"
    depends_on:
      - growthbook-mongo

  store:
    build:
      context: .
      dockerfile: apps/store/Dockerfile
      args:
        API_URL: http://api:8000
      secrets:
        - contentful_space_id
        - contentful_access_token
    env_file: apps/store/.env.local
    environment:
      API_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  events-data:
  growthbook-mongo-data:

secrets:
  contentful_space_id:
    environment: CONTENTFUL_SPACE_ID
  contentful_access_token:
    environment: CONTENTFUL_ACCESS_TOKEN
