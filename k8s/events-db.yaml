apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: events-db-data
  namespace: ninjamountain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-db
  namespace: ninjamountain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: events-db
  template:
    metadata:
      labels:
        app: events-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: events
            - name: POSTGRES_DB
              value: events
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: events-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "events", "-d", "events"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "events", "-d", "events"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: events-db-data
        - name: init
          configMap:
            name: events-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: events-db
  namespace: ninjamountain
spec:
  selector:
    app: events-db
  ports:
    - port: 5432
      targetPort: 5432
