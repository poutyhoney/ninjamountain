apiVersion: v1
kind: ConfigMap
metadata:
  name: store-config
  namespace: ninjamountain
data:
  API_URL: http://api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: ninjamountain
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: store
          image: ninjamountain-store:k1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: store-config
            - secretRef:
                name: store-secrets
          readinessProbe:
            httpGet:
              path: /checkout/cancel
              port: 3001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /checkout/cancel
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: ninjamountain
spec:
  selector:
    app: store
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: ninjamountain
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store
                port:
                  number: 3001
